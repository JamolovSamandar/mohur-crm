<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MOHUR CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505; --gold:#e8c98a; --text:#e9e6e1; --head:#ffffff;
    --t2:#a8a29a; --t3:#9b968e; --label:#8a8378; --foot:#6e6a63;
    --line:rgba(255,255,255,.18); --line-soft:rgba(255,255,255,.08);
    --gold-bg:rgba(232,201,138,.07);
    --r:20px; --r-sm:10px; --r-btn:12px; --r-pill:999px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:Arimo,Arial,sans-serif;font-weight:500;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  body{min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  button:disabled{opacity:.5}
  a{color:inherit}

  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
  .wm{font-family:Michroma,sans-serif;font-weight:400;letter-spacing:.2em;font-size:15px;color:var(--head);
    -webkit-text-stroke:.5px currentColor;paint-order:stroke fill}
  .wm small{font-family:Arimo,sans-serif;font-weight:400;letter-spacing:.12em;font-size:11px;color:var(--label);
    -webkit-text-stroke:0;margin-left:10px}
  .btn{min-height:44px;padding:0 18px;border-radius:var(--r-btn);border:1px solid var(--line);font-weight:500;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#050505;font-weight:700}
  .btn.full{width:100%}
  .btn.sm{min-height:36px;padding:0 14px;font-size:13px}

  .demo{border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--t3);
    font-weight:400;margin-bottom:16px}

  .stats{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
  .stats .g3{display:grid;grid-template-columns:repeat(3,1fr)}
  .stat{padding:16px 14px}
  .stat+.stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-size:28px;font-weight:700;color:var(--head);line-height:1.1}
  .stat b.g{color:var(--gold)}
  .stat span{display:block;margin-top:6px;font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
  .stats .more{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 14px;font-size:13px;color:var(--t2);font-weight:400}
  .stats .more b{color:var(--text);font-weight:500}

  .search{width:100%;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid var(--line);
    background:transparent;font-size:15px;margin-bottom:12px;outline:none}
  .search:focus{border-color:var(--t2)}
  .search::placeholder{color:var(--foot)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:13px;
    color:var(--t2);white-space:nowrap}
  .chip i{font-style:normal;color:var(--foot);margin-left:6px}
  .chip.on{background:var(--head);border-color:var(--head);color:#050505;font-weight:700}
  .chip.on i{color:#6e6a63}

  .list{display:flex;flex-direction:column;gap:8px}
  .card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 14px 12px}
  .card:active{border-color:var(--t2)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .name{font-weight:700;font-size:16px;color:var(--head);line-height:1.25}
  .meta{font-size:13px;color:var(--t2);font-weight:400;margin-top:4px;line-height:1.35}
  .sub{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--foot);font-weight:400}
  .due{color:var(--text)}
  .late{color:var(--gold)}

  .pill{flex:none;font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--t2);white-space:nowrap}
  .pill.st-new{border-color:var(--head);color:var(--head)}
  .pill.st-sotuv{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
  .pill.st-bekor{color:var(--foot);border-color:var(--line-soft)}

  .empty{padding:48px 0;text-align:center;color:var(--t3);font-weight:400;font-size:14px}

  .view{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));
    transform:translateX(100%);transition:transform .22s ease;z-index:5}
  .view.open{transform:none}
  .back{min-height:44px;color:var(--t2);font-size:14px;padding:16px 0 8px;display:block}
  .tg .back{display:none}
  .tg .view h1{margin-top:20px}
  .lbl{font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin:24px 0 10px}
  h1{font-size:28px;font-weight:700;color:var(--head);line-height:1.1;margin-top:12px}
  .facts{margin-top:12px;font-size:14px;color:var(--t2);font-weight:400;line-height:1.6}
  .facts b{color:var(--text);font-weight:500}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

  .sts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .st{min-height:44px;border-radius:var(--r-btn);border:1px solid var(--line);font-size:14px;color:var(--t2);padding:0 10px}
  .st.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);font-weight:700}
  .extra{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
  .extra p{font-size:13px;color:var(--t2);font-weight:400;margin-bottom:10px}
  .inline{display:flex;gap:8px}
  .inline .inp{flex:1}
  .rs{display:flex;flex-wrap:wrap;gap:8px}
  .rs .chip.on{background:transparent;border-color:var(--head);color:var(--head)}

  textarea,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-btn);background:transparent;padding:12px 14px;
    font-size:15px;line-height:1.5;outline:none;resize:vertical}
  textarea{min-height:96px}
  textarea:focus,.inp:focus{border-color:var(--t2)}
  .inp{min-height:44px;padding-top:0;padding-bottom:0}
  input[type=datetime-local].inp{color-scheme:dark}
  select.inp{appearance:none;background:transparent}
  select.inp option{background:#050505}
  .gap{height:8px}

  .rem{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
  .rem p{font-size:14px}
  .rem small{display:block;font-size:12px;color:var(--t3);font-weight:400;margin-top:2px}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .quick .btn{padding:0 8px;font-size:13px}

  .rec{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
  .rec .row{align-items:center}
  .rec p{font-size:14px;color:var(--text)}
  .rec small{display:block;font-size:12px;color:var(--foot);font-weight:400;margin-top:2px;word-break:break-all}
  .rec audio{width:100%;margin-top:10px;height:40px}

  .hist{border-left:1px solid var(--line);margin-left:4px;padding-left:16px}
  .hist div{position:relative;padding-bottom:12px;font-size:14px;color:var(--text)}
  .hist div::before{content:"";position:absolute;left:-20px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--t3)}
  .hist small{display:block;color:var(--foot);font-size:12px;font-weight:400}

  .tbl{border:1px solid var(--line);border-radius:var(--r-sm)}
  .tbl div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14px}
  .tbl div+div{border-top:1px solid var(--line-soft)}
  .tbl span{color:var(--t2);font-weight:400}
  .tbl b{font-weight:500;color:var(--text);text-align:right}
  .big{font-size:32px;font-weight:700;color:var(--gold);line-height:1.1}
  .big+.big{margin-top:4px}
  .muted{font-size:13px;color:var(--t3);font-weight:400}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px 16px;border-radius:var(--r-btn);
    border:1px solid var(--line);background:#050505;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .toast.on{opacity:1}
  .loading{color:var(--t3);font-weight:400;font-size:14px;padding:24px 0}
</style>
</head>
<body>
  <header class="top">
    <div class="wm">MOHUR<small>CRM</small></div>
    <button class="btn" id="addBtn">Lid qoʻshish</button>
  </header>

  <div class="demo" id="demo" hidden>Namuna maʼlumot. Telegram ichida ochilganda haqiqiy lidlar koʻrinadi.</div>

  <button class="stats" id="stats"></button>
  <input class="search" id="q" type="search" placeholder="Ism, telefon yoki soha boʻyicha qidirish" autocomplete="off">
  <nav class="chips" id="chips"></nav>
  <main class="list" id="list"><p class="loading">Yuklanmoqda…</p></main>

  <section class="view" id="leadView" aria-hidden="true"></section>
  <section class="view" id="repView" aria-hidden="true"></section>
  <section class="view" id="addView" aria-hidden="true">
    <button class="back" data-close>← Orqaga</button>
    <h1>Yangi lid</h1>
    <p class="lbl">Ism</p><input class="inp" id="fIsm" autocomplete="off">
    <p class="lbl">Telefon</p><input class="inp" id="fTel" type="tel" placeholder="+998" autocomplete="off">
    <p class="lbl">Soha</p><input class="inp" id="fSoha" autocomplete="off">
    <p class="lbl">Xizmat</p>
    <select class="inp" id="fXizmat"><option>Naming</option><option>Logotip</option><option>Brending</option><option selected>Patentlash</option></select>
    <p class="lbl">Manba</p>
    <select class="inp" id="fManba"><option>Qoʻngʻiroq</option><option>Instagram</option><option>Telegram</option><option>Tavsiya</option><option>Sayt</option><option>Boshqa</option></select>
    <p class="lbl">Izoh</p><textarea id="fIzoh"></textarea>
    <div class="gap"></div><div class="gap"></div>
    <button class="btn gold full" id="fSave">Saqlash</button>
  </section>

  <div class="toast" id="toast"></div>

<script>
// ── Sozlama: Apps Script Web App manzili (…/exec) ──
const API_URL = 'https://script.google.com/macros/s/AKfycbxVxwl2I9MqZdM-Yu1EW1-WnvuGqTMnb1XD1sitk5GvcZAKfI6etEQM8amhZ2WgtAfRaQ/exec';

const tg = window.Telegram && Telegram.WebApp;
const INIT = tg && tg.initData ? tg.initData : '';
const DEMO = !INIT;

const STATUSES = [
  {code:'new',label:'Yangi lid'},{code:'aloqa',label:'Aloqa oʻrnatildi'},{code:'malumot',label:'Maʼlumot berildi'},
  {code:'kelishuv',label:'Kelishuv qilindi'},{code:'sotuv',label:'Sotuv boʻldi'},{code:'bekor',label:'Bekor boʻldi'}];
const REASONS = [
  {code:'qimmat',label:'Qimmat'},{code:'javob',label:'Javob bermadi'},{code:'raqobat',label:'Raqobatchini tanladi'},
  {code:'keyin',label:'Keyinroq'},{code:'boshqa',label:'Boshqa'}];
const LABEL = Object.fromEntries(STATUSES.map(s=>[s.code,s.label]));
const RLABEL = Object.fromEntries(REASONS.map(s=>[s.code,s.label]));

let leads = [], filter = 'all', query = '', current = null, repScope = 'month';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits = s => String(s||'').replace(/\D/g,'');
const pad = n => String(n).padStart(2,'0');
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const short = s => s ? `${s.slice(8,10)}.${s.slice(5,7)} ${s.slice(11,16)}` : '';
const nowS = () => stamp(new Date());
const todayEnd = () => nowS().slice(0,10) + ' 23:59';

// ── API ──
async function api(name, data = {}) {
  if (DEMO) return demoApi(name, data);
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({api:name, initData:INIT, ...data})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'xato');
  return j;
}

// ── Pul ──
function money(list) {
  let usd = 0, som = 0;
  list.forEach(l => { const s = String(l.summa||''); const n = Number(digits(s)); if (!n) return; s.includes('$') ? usd += n : som += n; });
  const parts = [];
  if (usd) parts.push('$' + usd.toLocaleString('ru-RU').replace(/ /g,' '));
  if (som) parts.push(som.toLocaleString('ru-RU').replace(/ /g,' ') + ' soʻm');
  return parts;
}

// ── Ro'yxat ──
async function load() {
  try { leads = (await api('list')).leads; render(); }
  catch (e) { $('list').innerHTML = `<p class="empty">${e.message==='auth' ? 'Kirish huquqi yoʻq. Mini Appni botdan oching.' : 'Yuklab boʻlmadi. Qayta urinib koʻring.'}</p>`; }
}

function monthLeads() { const ym = nowS().slice(0,7); return leads.filter(l => l.sana.startsWith(ym)); }

function render() {
  const month = monthLeads();
  const sold = month.filter(l => l.status === 'sotuv');
  const m = money(sold);
  $('stats').innerHTML = `
    <div class="g3">
      <div class="stat"><b>${month.length}</b><span>Bu oy lid</span></div>
      <div class="stat"><b class="g">${sold.length}</b><span>Sotuv</span></div>
      <div class="stat"><b>${month.length ? Math.round(sold.length/month.length*100) : 0}%</b><span>Konversiya</span></div>
    </div>
    <div class="more"><span>Tushum: <b>${m.length ? m.join(' · ') : '—'}</b></span><span>Hisobot →</span></div>`;

  const te = todayEnd();
  const cnt = {}; leads.forEach(l => cnt[l.status] = (cnt[l.status]||0)+1);
  const dueN = leads.filter(l => l.eslatma && l.eslatma <= te).length;
  $('chips').innerHTML = [{code:'all',label:'Hammasi',n:leads.length}, {code:'due',label:'Bugun',n:dueN},
    ...STATUSES.map(s => ({...s, n:cnt[s.code]||0}))].map(s =>
    `<button class="chip ${filter===s.code?'on':''}" data-f="${s.code}">${s.label}<i>${s.n}</i></button>`).join('');

  const q = query.toLowerCase(), qd = digits(query), ns = nowS();
  let shown = leads.filter(l => (filter==='all' || (filter==='due' ? (l.eslatma && l.eslatma <= te) : l.status===filter)) &&
    (!q || [l.ism,l.soha,l.xizmat,l.izoh].join(' ').toLowerCase().includes(q) || (qd.length>=3 && digits(l.telefon).includes(qd))));
  if (filter === 'due') shown = shown.slice().sort((a,b) => a.eslatma < b.eslatma ? -1 : 1);

  $('list').innerHTML = shown.length ? shown.map(l => {
    const right = [];
    if (l.status === 'sotuv' && l.summa) right.push(esc(l.summa));
    else if (l.status === 'bekor' && l.sabab) right.push(esc(RLABEL[l.sabab] || l.sabab));
    if (+l.yozuvlar) right.push('yozuv ' + l.yozuvlar);
    const rem = l.eslatma ? `<span class="${l.eslatma <= ns ? 'late' : 'due'}">Eslatma ${short(l.eslatma)}</span>` : `<span>${short(l.sana)}</span>`;
    return `
    <button class="card" data-id="${esc(l.id)}">
      <div class="row">
        <div><div class="name">${esc(l.ism || l.telefon || '—')}${+l.murojaat > 1 ? ` <span class="muted">· ${l.murojaat}-murojaat</span>` : ''}</div>
          <div class="meta">${esc([l.xizmat, l.soha].filter(Boolean).join(' · ') || l.manba)}</div></div>
        <span class="pill st-${esc(l.status)}">${esc(LABEL[l.status]||l.status)}</span>
      </div>
      <div class="sub">${rem}<span>${right.join(' · ') || esc(l.telefon)}</span></div>
    </button>`;}).join('') : `<p class="empty">${leads.length ? 'Bu filtr boʻyicha lid yoʻq' : 'Hozircha lid yoʻq'}</p>`;
}

// ── Lid sahifasi ──
async function openLead(id) {
  const v = $('leadView');
  v.innerHTML = '<button class="back" data-close>← Orqaga</button><p class="loading">Yuklanmoqda…</p>';
  if (!v.classList.contains('open')) show(v);
  try { const d = await api('lead', {id}); apply(d); }
  catch (e) { v.innerHTML = '<button class="back" data-close>← Orqaga</button><p class="empty">Lid topilmadi</p>'; }
}

function apply(d) { current = d; patch(d.lead); renderLead(); }

function renderLead() {
  const d = current, l = d.lead, tel = digits(l.telefon);
  const extra = l.status === 'sotuv' ? `
    <div class="extra"><p>Sotuv summasi</p>
      <div class="inline"><input class="inp" id="amount" placeholder="$400 yoki 2500000" value="${esc(l.summa)}">
      <button class="btn" id="saveAmount">Saqlash</button></div></div>`
    : l.status === 'bekor' ? `
    <div class="extra"><p>Nega bekor boʻldi?</p>
      <div class="rs">${REASONS.map(r => `<button class="chip ${l.sabab===r.code?'on':''}" data-rs="${r.code}">${r.label}</button>`).join('')}</div></div>` : '';

  const t = new Date(), tm = new Date(t.getTime()+86400e3);
  const in1h = stamp(new Date(t.getTime()+3600e3));
  const today18 = stamp(t).slice(0,10) + ' 18:00';
  const tom10 = stamp(tm).slice(0,10) + ' 10:00';
  const quick = [['1 soatdan keyin', in1h], t.getHours() < 17 ? ['Bugun 18:00', today18] : ['3 soatdan keyin', stamp(new Date(t.getTime()+3*3600e3))], ['Ertaga 10:00', tom10]];

  $('leadView').innerHTML = `
    <button class="back" data-close>← Orqaga</button>
    <h1>${esc(l.ism || l.telefon || '—')}</h1>
    <div class="facts">
      ${l.telefon ? `<div>Telefon: <b>${esc(l.telefon)}</b></div>` : ''}
      ${l.soha ? `<div>Soha: <b>${esc(l.soha)}</b></div>` : ''}
      ${l.xizmat ? `<div>Xizmat: <b>${esc(l.xizmat)}</b></div>` : ''}
      <div>Manba: <b>${esc(l.manba)}</b> · ${esc(l.sana)} · #${esc(l.id)}</div>
      ${+l.murojaat > 1 ? `<div>Murojaatlar: <b>${esc(l.murojaat)}</b></div>` : ''}
    </div>
    ${tel ? `<div class="acts">
      <a class="btn" href="tel:+${tel}">Qoʻngʻiroq</a>
      <button class="btn" data-tg="${tel}">Telegramda yozish</button></div>` : ''}

    <p class="lbl">Holat</p>
    <div class="sts">${STATUSES.map(s => `<button class="st ${l.status===s.code?'on':''}" data-st="${s.code}">${s.label}</button>`).join('')}</div>
    ${extra}

    <p class="lbl">Eslatma</p>
    ${d.reminders.map(r => `<div class="rem"><div><p>${short(r.vaqt)}</p>${r.matn ? `<small>${esc(r.matn)}</small>` : ''}</div>
      <button class="btn sm" data-rd="${esc(r.id)}">Bajarildi</button></div>`).join('')}
    <div class="quick">${quick.map(q => `<button class="btn" data-q="${q[1]}">${q[0]}</button>`).join('')}</div>
    <input class="inp" id="remWhen" type="datetime-local" value="${tom10.replace(' ','T')}">
    <div class="gap"></div>
    <div class="inline"><input class="inp" id="remText" placeholder="Nima qilish kerak (ixtiyoriy)">
      <button class="btn" id="addRem">Qoʻyish</button></div>

    <p class="lbl">Izoh</p>
    <textarea id="note" placeholder="Suhbatdan muhim gaplar">${esc(l.izoh)}</textarea>
    <div class="gap"></div>
    <button class="btn full" id="saveNote">Izohni saqlash</button>

    <p class="lbl">Qoʻngʻiroq yozuvlari${d.recordings.length ? ' · ' + d.recordings.length : ''}</p>
    ${d.recordings.length ? d.recordings.slice().reverse().map(r => `
      <div class="rec"><div class="row">
        <div><p>${esc(r.qongiroq_vaqti || 'Yozuv')}</p><small>${esc(r.nom)}</small></div>
        <button class="btn sm" data-play="${esc(r.turi)}|${esc(r.file_id)}">Tinglash</button></div></div>`).join('')
      : '<p class="facts">Hali yozuv yoʻq. Shu raqamga qoʻngʻiroq qilsangiz, yozuv bir necha daqiqada shu yerda paydo boʻladi.</p>'}

    <p class="lbl">Tarix</p>
    <div class="hist">${d.history.slice().reverse().map(h => `<div>${esc(h.status==='qayta' ? 'Qayta murojaat' : (LABEL[h.status]||h.status))}<small>${esc(h.sana)}</small></div>`).join('')}</div>`;
}

async function act(name, data, okText) {
  try { const d = await api(name, {id: current.lead.id, ...data}); apply(d); if (okText) toast(okText); return true; }
  catch (e) { toast(e.message === 'vaqt' ? 'Vaqt notoʻgʻri' : 'Saqlanmadi'); return false; }
}

async function setStatus(code) {
  if (!current || current.lead.status === code) return;
  haptic();
  await act('status', {status: code}, LABEL[code]);
  if (code === 'sotuv') setTimeout(() => $('amount') && $('amount').focus(), 50);
}

async function addRem(when) {
  const v = (when || $('remWhen').value || '').replace('T',' ');
  if (!v) return toast('Vaqtni tanlang');
  if (v <= nowS()) return toast('Kelajakdagi vaqtni tanlang');
  const ok = await act('remind', {vaqt: v, matn: $('remText') ? $('remText').value.trim() : ''}, 'Eslatma: ' + short(v));
  if (ok) haptic();
}

async function play(btn) {
  const [turi, file_id] = btn.dataset.play.split('|');
  btn.textContent = 'Yuklanmoqda…'; btn.disabled = true;
  try {
    const d = await api('audio', {turi, file_id});
    const bin = atob(d.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const a = document.createElement('audio');
    a.controls = true; a.src = URL.createObjectURL(new Blob([u8], {type: d.mime}));
    btn.closest('.rec').appendChild(a); btn.remove(); a.play().catch(()=>{});
  } catch (e) { btn.textContent = 'Qayta urinish'; btn.disabled = false; }
}

async function createLead() {
  const lead = {ism:$('fIsm').value.trim(), telefon:$('fTel').value.trim(), soha:$('fSoha').value.trim(),
    xizmat:$('fXizmat').value, manba:$('fManba').value, izoh:$('fIzoh').value.trim()};
  if (!lead.ism && !lead.telefon) return toast('Ism yoki telefon kiriting');
  $('fSave').disabled = true;
  try {
    const d = await api('create', {lead});
    if (d.repeat) { patch(d.lead); toast('Bu raqam bor — qayta murojaat sifatida qoʻshildi'); }
    else { leads.unshift({...d.lead, yozuvlar:0}); render(); toast('Lid qoʻshildi'); }
    ['fIsm','fTel','fSoha','fIzoh'].forEach(id => $(id).value = '');
    hide($('addView'));
  } catch (e) { toast('Saqlanmadi'); }
  $('fSave').disabled = false;
}

function patch(l) {
  const i = leads.findIndex(x => x.id === l.id);
  if (i > -1) leads[i] = {...leads[i], ...l}; else leads.unshift(l);
  render();
}

// ── Hisobot ──
function renderReport() {
  const list = repScope === 'month' ? monthLeads() : leads;
  const sold = list.filter(l => l.status === 'sotuv');
  const lost = list.filter(l => l.status === 'bekor');
  const m = money(sold);
  const group = (arr, key, lab = x => x) => {
    const g = {}; arr.forEach(l => { const k = l[key] || '—'; g[k] = (g[k]||0)+1; });
    return Object.entries(g).sort((a,b) => b[1]-a[1]).map(([k,n]) => [lab(k), n]);
  };
  const src = {}; list.forEach(l => { const k = l.manba || '—'; src[k] = src[k] || [0,0]; src[k][0]++; if (l.status==='sotuv') src[k][1]++; });
  const rows = arr => arr.length ? `<div class="tbl">${arr.map(([a,b]) => `<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>` : '<p class="muted">Maʼlumot yoʻq</p>';

  $('repView').innerHTML = `
    <button class="back" data-close>← Orqaga</button>
    <h1>Hisobot</h1>
    <div class="gap"></div><div class="gap"></div>
    <nav class="chips" style="margin-bottom:0">
      <button class="chip ${repScope==='month'?'on':''}" data-rep="month">Bu oy</button>
      <button class="chip ${repScope==='all'?'on':''}" data-rep="all">Hammasi</button></nav>

    <p class="lbl">Tushum</p>
    ${m.length ? m.map(x => `<div class="big">${x}</div>`).join('') : '<div class="big">—</div>'}
    <p class="muted" style="margin-top:8px">${sold.length} ta sotuv · ${list.length} ta liddan · konversiya ${list.length ? Math.round(sold.length/list.length*100) : 0}%</p>

    <p class="lbl">Voronka</p>
    ${rows(STATUSES.map(s => [s.label, list.filter(l => l.status===s.code).length]))}

    <p class="lbl">Manba: lid → sotuv</p>
    ${rows(Object.entries(src).sort((a,b) => b[1][0]-a[1][0]).map(([k,v]) => [k, v[0] + ' → ' + v[1]]))}

    <p class="lbl">Sotuv: xizmatlar boʻyicha</p>
    ${rows(group(sold, 'xizmat'))}

    <p class="lbl">Bekor sabablari</p>
    ${rows(group(lost, 'sabab', k => RLABEL[k] || (k === '—' ? 'Sabab yozilmagan' : k)))}`;
}

// ── Ko'rinish boshqaruvi ──
const stack = [];
function show(v) { v.classList.add('open'); v.setAttribute('aria-hidden','false'); v.scrollTop = 0; stack.push(v); tg && tg.BackButton.show(); }
function hide(v) { v.classList.remove('open'); v.setAttribute('aria-hidden','true'); stack.splice(stack.indexOf(v),1); if (!stack.length && tg) tg.BackButton.hide(); }
function back() { if (stack.length) hide(stack[stack.length-1]); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2000); }
function haptic() { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const ds = t.dataset;
  if (ds.f) { filter = ds.f; render(); }
  else if (ds.id) openLead(ds.id);
  else if (ds.st) setStatus(ds.st);
  else if (ds.rs) act('reason', {sabab: ds.rs}, 'Sabab: ' + RLABEL[ds.rs]);
  else if (ds.q) addRem(ds.q);
  else if (ds.rd) act('remdone', {rid: ds.rd}, 'Bajarildi');
  else if (ds.play) play(t);
  else if (ds.rep) { repScope = ds.rep; renderReport(); }
  else if (ds.tg) { const u = 'https://t.me/+' + ds.tg; tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u); }
  else if (t.hasAttribute('data-close')) back();
  else if (t.id === 'saveNote') act('note', {izoh: $('note').value}, 'Izoh saqlandi');
  else if (t.id === 'saveAmount') act('amount', {summa: $('amount').value}, 'Summa saqlandi');
  else if (t.id === 'addRem') addRem();
  else if (t.id === 'addBtn') show($('addView'));
  else if (t.id === 'fSave') createLead();
  else if (t.id === 'stats') { renderReport(); show($('repView')); }
});
$('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

// ── Ishga tushirish ──
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505'); } catch (e) {}
  tg.BackButton.onClick(back);
  if (!DEMO) document.body.classList.add('tg');
}
if (DEMO) $('demo').hidden = false;
load().then(() => {
  const id = new URLSearchParams(location.search).get('lead');
  if (id) openLead(id);
});

      L({id:'1008',sana:`${ym}-12 11:05`,ism:'Jasur',telefon:'+998977770000',soha:'Nonvoyxona',xizmat:'Naming',manba:'Sayt',status:'sotuv',summa:'$250',yangilangan:`${ym}-12 15:20`}),
      L({id:'1007',sana:`${ym}-09 09:14`,ism:'Ulugʻbek',telefon:'+998946660011',soha:'Avtoservis',xizmat:'Patentlash',manba:'Qoʻngʻiroq',status:'bekor',sabab:'qimmat',yangilangan:`${ym}-10 10:00`,yozuvlar:1}),
      L({id:'1006',sana:`${ym}-05 13:30`,ism:'Madina',telefon:'+998998887766',soha:'Kosmetika',xizmat:'Logotip',manba:'Instagram',status:'malumot',yangilangan:`${ym}-06 10:00`}),
    ];
    demoApi.rem = {'1012':[{id:'1',vaqt:`${d} 11:00`,matn:'Qayta qoʻngʻiroq'}], '1011':[{id:'2',vaqt:`${d} 18:00`,matn:'KP boʻyicha fikrini soʻrash'}]};
  }
  const db = demoApi.db, find = id => db.find(l => l.id === id);
  const detail = l => {
    const rems = demoApi.rem[l.id] || []; l.eslatma = rems.map(r => r.vaqt).sort()[0] || '';
    return wait({lead:l, reminders:rems,
      history:[{sana:l.sana,status:'new'}].concat(l.status!=='new'?[{sana:l.yangilangan,status:l.status}]:[]),
      recordings:Array.from({length:+l.yozuvlar},(_,i)=>({turi:'drive',file_id:'demo'+i,nom:`Запись вызовов ${digits(l.telefon).slice(-9)}_${l.sana.slice(2,10).replace(/-/g,'')}_14095${i}.m4a`,qongiroq_vaqti:l.sana}))});
  };
  const wait = v => new Promise(r => setTimeout(() => r({ok:true, ...v}), 200));
  const l = data.id && find(data.id);
  switch (name) {
    case 'list': return wait({leads: db});
    case 'lead': return detail(l);
    case 'status': l.status = data.status; if (data.status !== 'bekor') l.sabab = ''; return detail(l);
    case 'amount': { const n = digits(data.summa); l.summa = /\$/.test(data.summa) ? '$'+n : Number(n).toLocaleString('ru-RU').replace(/ /g,' ')+' soʻm'; return detail(l); }
    case 'reason': l.sabab = data.sabab; return detail(l);
    case 'note': l.izoh = data.izoh; return detail(l);
    case 'remind': (demoApi.rem[l.id] = demoApi.rem[l.id] || []).push({id:String(Date.now()),vaqt:data.vaqt,matn:data.matn}); return detail(l);
    case 'remdone': { for (const k in demoApi.rem) { const i = demoApi.rem[k].findIndex(r => r.id === data.rid); if (i > -1) { demoApi.rem[k].splice(i,1); return detail(find(k)); } } }

    case 'audio': return Promise.reject(new Error('demo'));
  }
}
